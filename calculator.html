<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css"> 
  <script type="text/javascript" src="code.js"></script> 
</head>

<body>
  <div>
      <div id="result" class="result">
          0
      </div>

      <div>
          <div>
              <button id="fon" class="my-btn fon">Фон</button>
              <button id="okno" class="my-btn fon">Окно</button>
              <button id="MR" class="my-btn del">MR</button>
              <button id="ster" class="my-btn fon">×</button>
          </div>

          <div>
            <button id="iz" class="my-btn iz">Количество бит для номера молекулы молей вещества</button>
          </div>

          <div>
              <button id="clear" class="my-btn big">C</button>
              <button id="equal" class="my-btn big">=</button>
          </div>

          <div>
              <button id="step" class="my-btn oll">x²</button>
              <button id="koren" class="my-btn oll">√x</button>
              <button id="fakt" class="my-btn oll">x!</button>
              <button id="obrat" class="my-btn oll">1/x</button>
          </div>

          <div>
              <button id="M+" class="my-btn oll">M+</button>
              <button id="M-" class="my-btn oll">M-</button>
              <button id="znak" class="my-btn oll">+/-</button>
              <button id="prosent" class="my-btn oll">%</button>
          </div>

          <div>
              <button id="btn7" class="my-btn">7</button>
              <button id="btn8" class="my-btn">8</button>
              <button id="btn9" class="my-btn">9</button>
              <button id="del" class="my-btn oper">÷</button>
          </div>

          <div>
              <button id="btn4" class="my-btn">4</button>
              <button id="btn5" class="my-btn">5</button>
              <button id="btn6" class="my-btn">6</button>
              <button id="umn" class="my-btn oper">*</button>
          </div>

          <div>
              <button id="btn1" class="my-btn">1</button>
              <button id="btn2" class="my-btn">2</button>
              <button id="btn3" class="my-btn">3</button>
              <button id="minus" class="my-btn oper">-</button>
          </div>

          <div>
              <button id="btn0" class="my-btn">0</button>
              <button id="btn000" class="my-btn">000</button>
              <button id="tchk" class="my-btn oper">.</button>
              <button id="plus" class="my-btn oper">+</button>
          </div>

      </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
